name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify
        run: npm run verify
      - name: TMPDEBUG
        if: failure()
        run: npm test 2>&1 | grep -A40 "^not ok\|^    not ok\|^  not ok" | head -120
        shell: bash

  starter:
    name: Clean starter verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Copy checkout to temp dir (no .git, no node_modules)
        run: |
          mkdir -p "$RUNNER_TEMP/starter"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/starter"
      - name: Install
        working-directory: ${{ runner.temp }}/starter
        run: npm ci
      - name: Clean to starter
        working-directory: ${{ runner.temp }}/starter
        run: npm run starter:clean -- --yes
      - name: Verify starter
        working-directory: ${{ runner.temp }}/starter
        run: npm run verify -- --starter
