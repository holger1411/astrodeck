name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Static convention checks, lint, format, astro check
        run: npm run validate
      - name: Build
        run: npm run build
